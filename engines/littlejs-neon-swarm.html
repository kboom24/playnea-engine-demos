        drawCircleGradient(d.pos, 2.2, rgb(1, 1, 1, .45), rgb(1, 1, 1, 0)); drawCircle(d.pos, 1, col, .08, rgb(1, 1, 1));
        drawText({ spread: "S", rapid: "R", shield: "◎", heal: "+" }[d.kind], d.pos.add(vec2(0, -.05)), .7, rgb(0, 0, 0));
      });
      // enemies
      enemies.forEach(function (e) {
        if (e.dead || !e.pos || e.t < 0) return; var f = e.flash > 0;
        if (e.type === "dart") { drawPoly([vec2(0, -.8), vec2(.7, .5), vec2(0, .2), vec2(-.7, .5)], f ? rgb(1, 1, 1) : hsl(.93, 1, .6), .06, hsl(.93, 1, .85), e.pos, Math.sin(e.t * 3) * .3); }
        else if (e.type === "orb") { drawCircleGradient(e.pos, 2.4, hsl(.8, 1, .6, .45), hsl(.8, 1, .5, 0)); drawCircle(e.pos, 1.3, f ? rgb(1, 1, 1) : hsl(.8, .9, .55), .1, hsl(.8, 1, .85)); drawCircle(e.pos.add(vec2(0, -.1)), .5, rgb(1, 1, 1, .9)); }
        else if (e.type === "brute") { var pts = []; for (var i = 0; i < 6; i++) pts.push(vec2(Math.cos(i / 6 * Math.PI * 2), Math.sin(i / 6 * Math.PI * 2)).scale(1.2)); drawPoly(pts, f ? rgb(1, 1, 1) : hsl(.07, 1, .55), .12, hsl(.1, 1, .8), e.pos, e.t); drawRect(e.pos.add(vec2(0, 1.6)), vec2(2 * e.hp / e.max, .15), hsl(.33, 1, .55)); }
        else if (e.type === "boss") {
          drawCircleGradient(e.pos, 11, hsl(.08, 1, .5, .3), hsl(.08, 1, .5, 0));
          drawPoly([vec2(-4.5, .5), vec2(-2.5, 2), vec2(2.5, 2), vec2(4.5, .5), vec2(3, -1.8), vec2(1, -2.6), vec2(-1, -2.6), vec2(-3, -1.8)], f ? rgb(1, 1, 1) : hsl(.06, .9, .45), .2, hsl(.1, 1, .7), e.pos);
          drawCircle(e.pos.add(vec2(0, -.3)), 1.6, hsl(.98, 1, .55 + .2 * Math.sin(G.t * 8)), .1, rgb(1, 1, 1));
          drawCircle(e.pos.add(vec2(-2.6, -.4)), .7, hsl(.15, 1, .6)); drawCircle(e.pos.add(vec2(2.6, -.4)), .7, hsl(.15, 1, .6));
        }
      });
      // bullets
      bullets.forEach(function (b) { drawRect(b.pos, vec2(.18, .9), hsl(shipHue(), 1, .75)); });
      ebullets.forEach(function (b) { drawCircleGradient(b.pos, b.r * 4, hsl(.0, 1, .6, .6), hsl(0, 1, .5, 0)); drawCircle(b.pos, b.r * 2, hsl(.02, 1, .7), .05, rgb(1, 1, 1)); });
      // ship
      if (ship && (ship.alive || G.state !== "play") && !(ship.inv > 0 && Math.sin(G.t * 40) > .3)) {
        var h = shipHue(), p = ship.pos, tl = ship.tilt || 0;
        drawCircleGradient(p.add(vec2(0, -1)), 1.6 + Math.random() * .4, hsl(.1, 1, .6, .8), hsl(.05, 1, .5, 0));
        drawPoly([vec2(0, 1.1), vec2(.85 - tl * .2, -.7), vec2(0, -.35), vec2(-.85 - tl * .2, -.7)], hsl(h, .9, .6), .08, hsl(h, 1, .9), p);
        drawPoly([vec2(0, .6), vec2(.25, -.1), vec2(-.25, -.1)], rgb(1, 1, 1, .9), 0, rgb(1, 1, 1), p);
        if (ship.shield > 0) drawCircle(p, 2.4, hsl(.75, 1, .7, .18), .08, hsl(.75, 1, .8, .7));
      }
    },
    renderPost: function () {
      if (msg) { var a = Math.min(1, msg.t * 2); drawTextScreen(msg.text, vec2(mainCanvasSize.x / 2, mainCanvasSize.y * .4), Math.min(40, mainCanvasSize.x / 14), rgb(1, 1, 1, a), 6, rgb(0, 0, 0, a * .6)); }
      if (G.state === "play" && G.levelT < 3 && G.level === 1) drawTextScreen(G.input.touch ? "DRAG TO STEER" : "WASD / ARROWS / DRAG", vec2(mainCanvasSize.x / 2, mainCanvasSize.y * .78), 22, rgb(1, 1, 1, .5 + .5 * Math.sin(G.t * 6)), 4, rgb(0, 0, 0, .5));
      if (flash > 0) drawRect(vec2(0, H / 2), vec2(80, H + 10), rgb(1, 1, 1, flash * .5));
    },
    test: {
      clear: function () { var L = LEVELS[G.level - 1]; waveI = L.waves.length; enemies.forEach(function (e) { if (!e.dead && e.pos) damage(e, 9999); }); if (!enemies.length) enemies = [{ dead: true }]; },
      lose: function () { G.lives = 1; ship.inv = 0; ship.shield = 0; hitShip(); },
      fall: function () { hitShip(); }
    }
  };
  PNX.game(def);
})();
